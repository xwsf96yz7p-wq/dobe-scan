<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070a">
  <meta name="description" content="DOBE Screener — Solana low-cap degen filter">
  <title>DOBE — Screener</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#05070a;--surface:#0b1017;--surface2:#111823;--surface3:#151e2a;--border:#1d2938;--text:#edf3fa;--muted:#8495aa;--blue:#3b82f6;--blue2:#2563eb;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--cyan:#22d3ee;--purple:#a855f7;--shadow:0 18px 55px rgba(0,0,0,.28)}
    *{box-sizing:border-box;margin:0;padding:0} html{scroll-behavior:smooth} body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#10203b 0,#05070a 34%);color:var(--text);min-height:100vh;line-height:1.5}.container{max-width:760px;margin:0 auto;padding:28px 18px 60px}
    header{text-align:center;position:relative;padding:8px 0 18px}
    .logo-row{display:flex;align-items:center;justify-content:center;gap:10px}
    .logo-icon{width:36px;height:36px;flex-shrink:0}
    .logo{font-size:34px;font-weight:800;letter-spacing:-1.5px}.logo span{color:var(--blue)}
    .tagline{margin-top:6px;color:var(--muted);font-size:14px}
    .nav{display:flex;justify-content:center;gap:10px;margin:8px 0 4px}.nav a{font-size:12px;font-weight:700;text-decoration:none;padding:6px 12px;border:1px solid var(--border);border-radius:8px;color:var(--muted)}.nav a.active{color:#fff;background:rgba(59,130,246,.12);border-color:var(--blue)}
    .card{background:rgba(11,16,23,.94);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
    .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
    .meta .left{font-size:12px;color:var(--muted)}.meta .left strong{color:var(--text)}
    .sound-toggle{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;user-select:none}
    .sound-toggle input{cursor:pointer}
    .push-btn{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;transition:all .2s}
    .push-btn:hover{border-color:var(--purple);color:var(--purple)}
    .push-btn.on{background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.4);color:var(--purple)}
    .push-btn.denied{border-color:rgba(239,68,68,.4);color:var(--red)}
    .push-btn:disabled{opacity:.5;cursor:not-allowed}
    .push-hint{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;font-size:11px;line-height:1.5;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.25);color:#93c5fd}
    .push-hint.show{display:block}
    .push-hint.ios{background:rgba(168,85,247,.08);border-color:rgba(168,85,247,.25);color:#c4b5fd}
    .tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--surface2);padding:4px;border-radius:11px;border:1px solid var(--border)}
    .tab{flex:1;text-align:center;font-size:12px;font-weight:800;padding:)}9px 6px;border-radius:8px;cursor:pointer;color:var(--muted);border:0;background:transparent;transition:all .15s}
    .tab:hover{color:var(--text)}
    .tab.active{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.</25)}
    .tab.showcase.active{color:var(--green);box-shadow:0 2px 8px rgba(0,0,0,.25),inset 0 0 0 1px rgba(34,197,94,.3)}
    .tab.degen.active{color:var(--yellow);box-shadow:0 2pxb ></8px rgba(0span,0,0,.25>
),inset 0 0 0 1px rgba(234,179,8,.3)}
    .tab.sniper.active{color:var(--red);box-shadow:0 2px 8px rgba(0,0,0,.25),inset 0 0 0 1px rgba(239,68,68,.3)}
    .token{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--surface2);margin-bottom:8px;transition:border-color .3s,box-shadow .3s}
    .token:hover{border-color:rgba(59,130,246,.4)}
    .token.high{border-left:3px solid var(--green)}
    .token.mid{border-left:3px solid var(--yellow)}
    .token.low{border-left:3px solid #64748b}
    .logo-img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--surface3);border:2px solid var(--border)}
    .logo-ph{width:48px;height:48px;border-radius:50%;background:var(--surface3);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-size:14px}
    .info{min-width:0}.sym{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.name{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:11px}
    .stats span{color:var(--muted)}.stats b{color:var(--text);font-weight:600}
    .pos{color:var(--green)!important}.neg{color:var(--red)!important}
    .btns{display:flex;flex-direction:column;gap:5px;align-items:stretch}
    .btns a{display:block;text-align:center;font-size:10px;font-weight:800;padding:6px 10px;border-radius:8px;text-decoration:none;border:1px solid var(--border);color:var(--text);background:var(--surface3);min-width:72px}
    .btns a:hover{border-color:var(--blue);color:#fff}
    .btns a.gmgn{border-color:rgba(59,130,246,.35);color:var(--blue)}
    .btns a.pump{border-color:rgba(34,197,94,.35);color:var(--green)}
    .btns a.axiom{border-color:rgba(234,179,8,.35);color:var(--yellow)}
    .degen-badge{width:56px;height:56px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:800;border:2px solid;flex-shrink:0}
    .degen-badge.high{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.07)}
    .degen-badge.mid{border-color:var(--yellow);color:var(--yellow);background:rgba(234,179,8,.07)}
    .degen-badge.low{border-color:#64748b;color:#94a3b8;background:rgba(100,116,139,.07)}
    .degen-badge .num{font-size:17px;line-height:1}
    .degen-badge .lbl{font-size:7px;letter-spacing:.05em;margin-top:2px;opacity:.8}
    .degen-row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center}
    .lvl-bar{display:flex;gap:3px;margin-top:5px;font-size:9px;font-family:'JetBrains Mono',monospace;flex-wrap:wrap}
    .lvl{display:flex;align-items:center;gap:3px;padding:2px 5px;border-radius:5px;background:var(--surface3);border:1px solid var(--border)}
    .lvl.safety{color:#60a5fa}
    .lvl.momentum{color:#f59e0b}
    .lvl.smart{color:var(--purple)}
    .lvl.smart.active{background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.35)}
    .loading{text-align:center;padding:40px 10px;color:var(--muted)}
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
    .empty{text-align:center;padding:28px;color:var(--muted);font-size:13px}
    .disclaimer{margin-top:18px;font-size:11px;color:var(--muted);text-align:center;line-height:1.6}
    .footer{text-align:center;margin-top:24px;color:#526174;font-size:11px}
    .refresh{font-size:11px;font-weight:700;color:var(--blue);background:transparent;border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer}
    .refresh:hover{border-color:var(--blue)}
    @media(max-width:650px){
      .container{padding:18px 12px 45px}
      .token{grid-template-columns:40px 1fr auto;}
      .btns{flex-direction:row;grid-column:1/-1;justify-content:flex-start;margin-top:6px}
      .logo-img,.logo-ph{width:40px;height:40px}
      .degen-badge{width:48px;height:48px}.degen-badge .num{font-size:15px}
      .logo-icon{width:28px;height:28px}
      .logo{font-size:28px}
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-row">
      <svg class="logo-icon" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="none" stroke="#3b82f6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
          d="M72 22 C74 20 78 20 80 22 L82 34 C84 38 86 42 90 46 C94 50 100 54 106 58 C110 61 114 66 116 72 C117 78 116 84 112 88 C108 92 102 94 96 94 L88 94 C86 100 82 108 76 116 C74 118 72 120 70 122 L68 118 C70 110 72 102 72 94 C72 86 70 80 66 76 C62 72 56 68 52 64 C48 60 44 54 42 48 C40 42 40 34 44 28 C48 22 54 18 60 18 C64 18 68 20 72 22 Z" />
        <path fill="#3b82f6" d="M86 46 C88 44 92 44 94 46 C96 48 96 52 94 54 C92 56 88 56 86 54 C84 52 84 48 86 46 Z" />
      </svg>
      <div class="logo">DOBE <span>SCAN</span></div>
    </div>
    <div class="nav">
      <a href="/">CHECKER</a>
      <a href="/screener" class="active">SCREENER</a>
    </div>
    <div class="tagline">Solana low-cap · Degen Score</div>
  </header>

  <section class="card">
    <div class="meta">
      <div class="left">Updated: <strong id="updated">—</strong> · Tokens: <strong id="count">—</strong></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <label class="sound-toggle" title="Sound on new token">
          <input type="checkbox" id="soundToggle" checked>
          🔔
        </label>
        <button class="push-btn" id="pushBtn" onclick="togglePush()">🔕 Уведомления</button>
        <button class="refresh" onclick="load()">Refresh</button>
      </div>
    </div>
    <div class="push-hint" id="pushHint"></div>

    <div class="tabs" role="tablist">
      <button class="tab showcase" id="tabShowcase" onclick="setMode('showcase')">🟢 Showcase</button>
      <button class="tab degen" id="tabDegen" onclick="setMode('degen')">🟡 Degen</button>
      <button class="tab sniper" id="tabSniper" onclick="setMode('sniper')">🔴 Sniper</button>
    </div>

    <div id="list"><div class="loading"><div class="spinner"></div>Scanning…</div></div>
  </section>

  <p class="disclaimer">Not financial advice. Always DYOR.</p>
  <div class="footer">DOBE · Screener</div>
</div>

<script>
// ============================================================
// MODE
// ============================================================
const MODES = ['showcase','degen','sniper'];
let currentMode = 'degen';

function detectModeFromUrl(){
  try {
    const p = new URLSearchParams(window.location.search);
    const m = (p.get('mode') || '').toLowerCase();
    if (MODES.includes(m)) return m;
  } catch {}
  const saved = localStorage.getItem('dobe_mode');
  if (MODES.includes(saved)) return saved;
  return 'degen';
}

function setMode(m){
  if (!MODES.includes(m)) m = 'degen';
  currentMode = m;
  localStorage.setItem('dobe_mode', m);
  MODES.forEach(id => {
    const el = document.getElementById('tab' + id.charAt(0).toUpperCase() + id.slice(1));
    if (el) el.classList.toggle('active', id === m);
  });
  previousAddresses = new Set();
  load();
}

// ============================================================
// SOUND
// ============================================================
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playNotificationSound() {
  if (!soundEnabled || !audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const tones = [
      { freq: 523.25, start: 0,    dur: 0.12 },
      { freq: 783.99, start: 0.14, dur: 0.20 }
    ];
    tones.forEach(t => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = t.freq;
      gain.gain.setValueAtTime(0, now + t.start);
      gain.gain.linearRampToValueAtTime(0.25, now + t.start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + t.start + t.dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + t.start);
      osc.stop(now + t.start + t.dur + 0.05);
    });
  } catch (e) {}
}

['click','touchstart','keydown'].forEach(evt => {
  document.addEventListener(evt, () => initAudio(), { once: true, passive: true });
});

document.getElementById('soundToggle').addEventListener('change', (e) => {
  soundEnabled = e.target.checked;
  localStorage.setItem('dobe_sound', soundEnabled ? '1' : '0');
  if (soundEnabled) initAudio();
});

if (localStorage.getItem('dobe_sound') === '0') {
  soundEnabled = false;
  document.getElementById('soundToggle').checked = false;
}

// ============================================================
// PUSH
// ============================================================
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

const VAPID_PUBLIC_KEY = 'BL3uehL3hiPl5gomkJHsvcuysH0wpNfb0Zd23_DOkKkgwPHilEuTn6RqV0FpMX3FnTfBII9raBjc9K7v8uzvp7A';

let pushSubscription = null;

function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }

function updatePushButton() {
  const btn = document.getElementById('pushBtn');
  const hint = document.getElementById('pushHint');
  if (!pushSupported()) { btn.textContent = '🔕 Не поддерживается'; btn.disabled = true; return; }

  if (isIOS() && !isStandalone()) {
    btn.textContent = '🔕 Уведомления';
    hint.classList.add('show','ios');
    hint.innerHTML = '📱 <b>iPhone:</b> добавь сайт на экран Домой → открой с иконки → включи уведомления.';
    return;
  }
  if (Notification.permission === 'denied') {
    btn.textContent = '🔕 Заблокированы';
    btn.classList.add('denied');
    hint.classList.add('show');
    hint.innerHTML = '⚠️ Уведомления заблокированы в настройках браузера.';
    return;
  }
  if (pushSubscription) {
    btn.textContent = '🔔 Включены';
    btn.classList.add('on');
  } else {
    btn.textContent = '🔕 Уведомления';
    btn.classList.remove('on');
  }
}

async function initPush() {
  if (!pushSupported()) { updatePushButton(); return; }
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      pushSubscription = sub;
      await fetch('/api/push/subscribe', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ subscription: sub })
      }).catch(()=>{});
    }
  } catch (e) {}
  updatePushButton();
}

async function togglePush() {
  const btn = document.getElementById('pushBtn');
  if (!pushSupported()) return;

  if (pushSubscription) {
    try {
      await fetch('/api/push/unsubscribe', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ endpoint: pushSubscription.endpoint })
      });
      await pushSubscription.unsubscribe();
      pushSubscription = null;
      updatePushButton();
    } catch { alert('Не удалось отключить'); }
    return;
  }

  btn.disabled = true;
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') { updatePushButton(); btn.disabled = false; return; }

    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });

    await fetch('/api/push/subscribe', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ subscription: sub })
    });

    pushSubscription = sub;
    await fetch('/api/push/test').catch(()=>{});
    updatePushButton();
  } catch (e) {
    alert('Ошибка: ' + (e.message || e));
  }
  btn.disabled = false;
}

// ============================================================
// DATA
// ============================================================
let previousAddresses = new Set();

function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function fmtNum(n){if(n==null||Number.isNaN(Number(n)))return '—';n=Number(n);if(Math.abs(n)>=1e9)return (n/1e9).toFixed(2)+'B';if(Math.abs(n)>=1e6)return (n/1e6).toFixed(2)+'M';if(Math.abs(n)>=1e3)return (n/1e3).toFixed(1)+'K';if(Math.abs(n)<1)return n.toPrecision(3);return n.toFixed(2);}
function fmtMoney(n){return n==null?'—':'$'+fmtNum(n);}
function ageTxt(h){if(h==null)return '—';if(h<1)return Math.round(h*60)+'m';if(h<24)return h.toFixed(1)+'h';return (h/24).toFixed(1)+'d';}
function chgClass(v){if(v==null)return '';return v>0?'pos':v<0?'neg':'';}
function chgTxt(v){if(v==null)return '—';return (v>0?'+':'')+Number(v).toFixed(1)+'%';}

async function load(){
  const list = document.getElementById('list');
  if (!list.querySelector('.token')) {
    list.innerHTML = '<div class="loading"><div class="spinner"></div>Scanning…</div>';
  }
  try {
    const res = await fetch('/api/screener?mode=' + currentMode + '&t=' + Date.now(), { headers: { Accept:'application/json' } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error');

    document.getElementById('updated').textContent = new Date(data.updatedAt).toLocaleTimeString();
    document.getElementById('count').textContent = data.count;

    const tokens = data.tokens || [];
    const currentAddresses = new Set(tokens.map(t => t.address));
    if (previousAddresses.size > 0) {
      const newOnes = tokens.filter(t => !previousAddresses.has(t.address));
      if (newOnes.length > 0) playNotificationSound();
    }
    previousAddresses = currentAddresses;

    if (!tokens.length) {
      list.innerHTML = '<div class="empty">No tokens matched. Try again in a minute.</div>';
      return;
    }

    list.innerHTML = tokens.map(t => {
      const ch1=t.priceChange1h, ch24=t.priceChange24h;
      const d=t.degen||{total:0,tier:'low',safety:0,momentum:0,smart:0,smartFlag:false};
      const logo=t.logo
        ? `<img class="logo-img" src="${esc(t.logo)}" alt="" onerror="this.outerHTML='<div class=\\'logo-ph\\'>${esc((t.symbol||'?').slice(0,2))}</div>'">`
        : `<div class="logo-ph">${esc((t.symbol||'?').slice(0,2))}</div>`;
      const vol1hRatio = (t.volume24h&&t.volume1h)?(t.volume1h/t.volume24h*100).toFixed(0)+'%':'—';
      const bs1h = (t.sells1h>0)?(t.buys1h/t.sells1h).toFixed(2):'∞';
      return `<div class="token ${d.tier}">
        ${logo}
        <div class="info">
          <div class="sym">$${esc(t.symbol)} <span style="font-size:11px;color:var(--muted);font-weight:600">${esc(t.name)}</span></div>
          <div class="name">${esc(t.address.slice(0,6))}…${esc(t.address.slice(-4))} · ${esc(t.dex||'dex')}</div>
          <div class="stats">
            <span>MC <b>${fmtMoney(t.marketCap)}</b></span>
            <span>Liq <b>${fmtMoney(t.liquidity)}</b></span>
            <span>Vol1h <b>${fmtMoney(t.volume1h)}</b></span>
            <span>Age <b>${ageTxt(t.ageHours)}</b></span>
            <span class="${chgClass(ch1)}">1h <b>${chgTxt(ch1            <span class="${chgClass(ch24)}">24h <b>${chgTxt(ch24)}</b></span>
          </div>
          <div class="lvl-bar">
            <span class="lvl safety">🛡 ${d.safety}</span>
            <span class="lvl momentum">⚡ ${d.momentum}</span>
            <span class="lvl smart ${d.smart>0?'active':''}">🐋 ${d.smart}</span>
            <span class="lvl">1h/24h ${vol1hRatio}</span>
            <span class="lvl">B/S ${bs1h}</span>
          </div>
        </div>
        <div class="degen-row" style="display:contents">
          <div class="degen-badge ${d.tier}">
            <div class="num">${d.total}</div>
            <div class="lbl">SCORE</div>
          </div>
        </div>
        <div class="btns">
          <a class="gmgn" href="${esc(t.links.gmgn)}" target="_blank" rel="noopener">GMGN</a>
          <a class="pump" href="${esc(t.links.pump)}" target="_blank" rel="noopener">PUMP</a>
          <a class="axiom" href="${esc(t.links.axiom)}" target="_blank" rel="noopener">AXIOM</a>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    list.innerHTML = `<div class="empty" style="color:var(--red)">${esc(e.message||'Network error')}</div>`;
  }
}

// ============================================================
// BOOT
// ============================================================
initPush();
setMode(detectModeFromUrl());
setInterval(load, 45000);
</script>
</body>
</html>
